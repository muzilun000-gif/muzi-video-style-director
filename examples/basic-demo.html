let active='kinetic',playing=true,time=0,previous;
const stage=document.getElementById('stage'),slider=document.getElementById('time'),play=document.getElementById('play');
const notes={kinetic:'适合观点和对比：字的大小与位置表达重点。',launch:'适合产品介绍：一个主画面，留白与轻推镜头。',editorial:'适合知识解释：先亮证据，再展开关系。',data:'适合真实数据：单位、区间和示例标签都要看得见。',paper:'适合故事笔记：每张纸卡承担一个信息。',ink:'适合小故事：先有角色目标，再有动作。',spatial:'适合结构关系：这里是二维投影，非真实3D场景。',rhythm:'适合音乐视觉：这里没有音轨，只演示120 BPM节拍。',terminal:'逐行呈现操作过程，不能伪造真实执行结果。',isometric:'等距投影呈现工序，每个方块有输入输出含义。',pixel:'将任务拆成关卡，像素演示不代表真实游戏。',blueprint:'网格、分区和尺寸线，让结构规则可见。',risograph:'双色网点与套印错位，正文仍保持清晰。',monoline:'只用线条与节点，解释关系。',comic:'三个分格表达起因、反应和转折。',timeline:'按证据展开过程，没有真实日期就用步骤。',map:'抽象路线示意，不代表真实地理或导航。',collage:'标题块与裁切材料形成视觉关系，不用晃动代替观点。'};

styles.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.style=id;b.addEventListener('click',()=>{active=id;time=0;previous=undefined;draw();});nav.appendChild(b)});
function renderAt(t){stage.innerHTML=renderSVG(active,t)}
function draw(){renderAt(time);slider.value=time;document.getElementById('status').textContent=`${time.toFixed(2)} / 8.00s`;document.getElementById('note').textContent=notes[active];for(const b of nav.children)b.setAttribute('aria-pressed',String(b.dataset.style===active));}
play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放';previous=undefined;};
slider.oninput=()=>{time=Number(slider.value);playing=false;play.textContent='播放';draw();};
function frame(now){if(playing){if(previous!==undefined)time=(time+(now-previous)/1000)%8;draw()}previous=now;requestAnimationFrame(frame)}
document.getElementById('png').onclick=async()=>{try{await document.fonts.ready;const svg=renderSVG(active,time);const u=URL.createObjectURL(new Blob([svg],{type:'image/svg+xml'}));try{const im=new Image();im.src=u;await im.decode();const c=document.createElement('canvas');c.width=1920;c.height=1080;c.getContext('2d').drawImage(im,0,0,1920,1080);const blob=await new Promise(r=>c.toBlob(r,'image/png'));if(!blob)throw Error('PNG export returned no data');const a=document.createElement('a');const output=URL.createObjectURL(blob);a.href=output;a.download=`muzi-${active}-${time.toFixed(2)}.png`;a.click();setTimeout(()=>URL.revokeObjectURL(output),1000);}finally{URL.revokeObjectURL(u)}}catch(e){document.getElementById('error').textContent='导出失败：'+e.message}};
draw();requestAnimationFrame(frame);
</script></html>
